# GitLab CI/CD Pipeline for eShop .NET Aspire Project
# This pipeline follows best practices for .NET Aspire projects with Docker containerization

stages:
  - validate
  - test
  - build
  - docker-build
  - security-scan
  - deploy

variables:
  # .NET Configuration
  DOTNET_VERSION: "9.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  
  # Docker Configuration
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "$CI_PROJECT_DIR/.certs"
  
  # Registry Configuration - GitHub Container Registry (GHCR)
  REGISTRY_URL: ghcr.io
  REGISTRY_IMAGE: ghcr.io/$GITHUB_USERNAME
  REGISTRY_USER: $GITHUB_USERNAME
  REGISTRY_PASSWORD: $GITHUB_TOKEN
  
  # Build Configuration
  SOLUTION_FILE: "src/eShop.AppHost/eShop.AppHost.csproj"
  BUILD_CONFIGURATION: "Release"
  BUILD_PLATFORM: "linux-x64"
  
  # Cache Configuration
  CACHE_KEY: "$CI_COMMIT_REF_SLUG-$CI_PROJECT_PATH"

# Global before_script for all jobs
before_script:
  - echo "Setting up .NET environment..."
  - dotnet --version
  - dotnet --list-sdks
  - dotnet --list-runtimes

# Cache configuration
cache:
  key: $CACHE_KEY
  paths:
    - .nuget/packages/
    - src/**/bin/
    - src/**/obj/
    - tests/**/bin/
    - tests/**/obj/

# Template for building .NET microservices
.build-dotnet-service:
  stage: docker-build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_BUILDKIT: 1
  script:
    - echo "Building and pushing $SERVICE_NAME image..."
    - echo $GITHUB_TOKEN | docker login ghcr.io -u $GITHUB_USERNAME --password-stdin
    - |
      docker build \
        --file $DOCKERFILE_PATH \
        --tag $REGISTRY_IMAGE/$SERVICE_NAME:$CI_COMMIT_SHA \
        --tag $REGISTRY_IMAGE/$SERVICE_NAME:$CI_COMMIT_REF_SLUG \
        --build-arg BUILD_CONFIGURATION=$BUILD_CONFIGURATION \
        --build-arg BUILD_PLATFORM=$BUILD_PLATFORM \
        .
    - docker push $REGISTRY_IMAGE/$SERVICE_NAME:$CI_COMMIT_SHA
    - docker push $REGISTRY_IMAGE/$SERVICE_NAME:$CI_COMMIT_REF_SLUG
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag $REGISTRY_IMAGE/$SERVICE_NAME:$CI_COMMIT_SHA $REGISTRY_IMAGE/$SERVICE_NAME:latest
        docker push $REGISTRY_IMAGE/$SERVICE_NAME:latest
      fi

# Template for generating .NET container images
.generate-dotnet-container:
  stage: docker-build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_BUILDKIT: 1
  before_script:
    - echo "Setting up Docker environment..."
    - echo $GITHUB_TOKEN | docker login ghcr.io -u $GITHUB_USERNAME --password-stdin
  script:
    - echo "Generating and pushing $SERVICE_NAME container image..."
    - |
      dotnet publish $PROJECT_PATH \
        --configuration $BUILD_CONFIGURATION \
        --output ./publish/$SERVICE_NAME \
        --no-restore \
        --self-contained false \
        -p:PublishProfile=DefaultContainer \
        -p:ContainerImageName=$REGISTRY_IMAGE/$SERVICE_NAME \
        -p:ContainerImageTag=$CI_COMMIT_SHA \
        -p:ContainerRegistry=ghcr.io \
        -p:ContainerRepository=$GITHUB_USERNAME/$SERVICE_NAME
    - |
      dotnet publish $PROJECT_PATH \
        --configuration $BUILD_CONFIGURATION \
        --output ./publish/$SERVICE_NAME-branch \
        --no-restore \
        --self-contained false \
        -p:PublishProfile=DefaultContainer \
        -p:ContainerImageName=$REGISTRY_IMAGE/$SERVICE_NAME \
        -p:ContainerImageTag=$CI_COMMIT_REF_SLUG \
        -p:ContainerRegistry=ghcr.io \
        -p:ContainerRepository=$GITHUB_USERNAME/$SERVICE_NAME
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        dotnet publish $PROJECT_PATH \
          --configuration $BUILD_CONFIGURATION \
          --output ./publish/$SERVICE_NAME-latest \
          --no-restore \
          --self-contained false \
          -p:PublishProfile=DefaultContainer \
          -p:ContainerImageName=$REGISTRY_IMAGE/$SERVICE_NAME \
          -p:ContainerImageTag=latest \
          -p:ContainerRegistry=ghcr.io \
          -p:ContainerRepository=$GITHUB_USERNAME/$SERVICE_NAME
      fi

# Include modular stage files
include:
  - local: '.gitlab-ci/validate.yaml'
  - local: '.gitlab-ci/test.yaml'
  - local: '.gitlab-ci/build.yaml'
  - local: '.gitlab-ci/docker-build.yaml'
  - local: '.gitlab-ci/docker-generate-build.yaml'
  - local: '.gitlab-ci/security-scan.yaml'
  - local: '.gitlab-ci/deploy.yaml'


