# GitLab CI/CD Pipeline for eShop .NET Aspire Project
# This pipeline follows best practices for .NET Aspire projects with Docker containerization

stages:
  - validate
  - test
  #- build
  - docker-generate
  - security-scan
  - deploy

# Include modular stage files
include:
  #- local: '.gitlab-ci/validate.yaml'
  #- local: '.gitlab-ci/test.yaml'
  # - local: '.gitlab-ci/build.yaml'
  #- local: '.gitlab-ci/docker-build.yaml'
  - local: '.gitlab-ci/docker-generate-build.yaml'
  #- local: '.gitlab-ci/docker-publish.yaml'
 # - local: '.gitlab-ci/security-scan.yaml'
  #- local: '.gitlab-ci/deploy.yaml'




variables:
  # .NET Configuration
  DOTNET_VERSION: "9.0.x"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  
  # Docker Configuration
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_VERIFY: 1
  
  # Registry Configuration - GitHub Container Registry (GHCR)
  REGISTRY_URL: ghcr.io
  REGISTRY_IMAGE: ghcr.io/$GITHUB_USERNAME
  REGISTRY_USER: $GITHUB_USERNAME
  REGISTRY_PASSWORD: $GITHUB_TOKEN
  
  # Build Configuration
  SOLUTION_FILE: "src/eShop.AppHost/eShop.AppHost.csproj"
  BUILD_CONFIGURATION: "Release"
  BUILD_PLATFORM: "linux-x64"
  
  # Cache Configuration
  CACHE_KEY: "$CI_COMMIT_REF_SLUG-$CI_PROJECT_PATH"

# Global before_script for all jobs
before_script:
  - echo "Setting up .NET environment..."
  - dotnet --version
  - dotnet --list-sdks
  - dotnet --list-runtimes

# Cache configuration
cache:
  key: $CACHE_KEY
  paths:
    - .nuget/packages/
    - src/**/bin/
    - src/**/obj/
    - tests/**/bin/
    - tests/**/obj/

# Template for building .NET microservices
.build-dotnet-service:
  stage: docker-build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_BUILDKIT: 1
  script:
    - echo "Building and pushing $SERVICE_NAME image..."
    - echo $GITHUB_TOKEN | docker login ghcr.io -u $GITHUB_USERNAME --password-stdin
    - |
      docker build \
        --file $DOCKERFILE_PATH \
        --tag $REGISTRY_IMAGE/$SERVICE_NAME:$CI_COMMIT_SHA \
        --tag $REGISTRY_IMAGE/$SERVICE_NAME:$CI_COMMIT_REF_SLUG \
        --build-arg BUILD_CONFIGURATION=$BUILD_CONFIGURATION \
        --build-arg BUILD_PLATFORM=$BUILD_PLATFORM \
        .
    - docker push $REGISTRY_IMAGE/$SERVICE_NAME:$CI_COMMIT_SHA
    - docker push $REGISTRY_IMAGE/$SERVICE_NAME:$CI_COMMIT_REF_SLUG
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag $REGISTRY_IMAGE/$SERVICE_NAME:$CI_COMMIT_SHA $REGISTRY_IMAGE/$SERVICE_NAME:latest
        docker push $REGISTRY_IMAGE/$SERVICE_NAME:latest
      fi

# Template for generating .NET container images
.generate-dotnet-container:
  stage: docker-generate
  image: mcr.microsoft.com/dotnet/sdk:9.0 #todo: create your own image that already curls the cli   
  services:
    - name: docker:24.0.5-dind
      command: ["--tls=false", "--registry-mirror=https://ghcr.io/$GITHUB_USERNAME/ramses/mirror"]
  variables:
    # Docker-in-Docker Configuration (Non-TLS Mode for testing)
    DOCKER_HOST: tcp://docker:2375          # Connect to DinD daemon via TCP (non-TLS port)
    DOCKER_DRIVER: overlay2                  # Use modern storage driver for better performance
    DOCKER_BUILDKIT: 1                      # Enable BuildKit for faster builds
    # Disable TLS for testing
    DOCKER_TLS_CERTDIR: ""
    DOCKER_TLS_VERIFY: ""
    DOCKER_CERT_PATH: ""
  before_script:
    - echo "Setting up Docker environment and installing Docker CLI..."
    - apt-get update -qq && apt-get install -y -qq apt-transport-https ca-certificates curl gnupg
    - curl -fsSL https://download.docker.com/linux/debian/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
    - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/debian bullseye stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
    - apt-get update -qq && apt-get install -y -qq docker-ce-cli
    - echo "Docker CLI installed successfully"
    - docker --version 
    - echo "Testing Docker connection to DinD daemon..."
    - echo "DOCKER_HOST=$DOCKER_HOST"
    - echo "DOCKER_TLS_CERTDIR=$DOCKER_TLS_CERTDIR"
    - echo "DOCKER_CERT_PATH=$DOCKER_CERT_PATH"
    - echo "All Docker environment variables:"
    - env | grep DOCKER || echo "No DOCKER variables found"
    - echo "Checking for TLS certificates..."
    - ls -la /certs/ 2>/dev/null || echo "No /certs directory found"
    - echo "Waiting for TLS certificates to be generated..."
    - timeout 30 sh -c 'until docker info >/dev/null 2>&1; do sleep 1; done' || echo "Docker daemon not ready"
    - docker info || echo "Failed to connect to Docker daemon"
    - echo "Logging into GHCR..."
    - echo $GITHUB_TOKEN | docker login ghcr.io -u $GITHUB_USERNAME --password-stdin
  script:
    - echo "Generating and pushing $SERVICE_NAME container image..."
    - echo "Debugging Docker availability..."
    - echo "Restoring packages for $PROJECT_PATH..."
    - dotnet restore $PROJECT_PATH
    - |
      dotnet publish $PROJECT_PATH \
        --configuration $BUILD_CONFIGURATION \
        --output ./publish/$SERVICE_NAME \
        --no-restore \
        --self-contained false \
        -p:PublishProfile=DefaultContainer \
        -p:ContainerImageTag=$CI_COMMIT_SHA \
        -p:ContainerRegistry=ghcr.io \
        -p:ContainerRepository=$GITHUB_USERNAME/eShop/$SERVICE_NAME

# Template for publishing Docker images
.publish-docker-image:
  stage: image-publish
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_BUILDKIT: 1
  before_script:
    - echo "Setting up Docker environment..."
    - echo $GITHUB_TOKEN | docker login ghcr.io -u $GITHUB_USERNAME --password-stdin
  script:
    - echo "Pushing $SERVICE_NAME container image to GHCR..."
    - |
      # Load and push the image
      if [ -f "publish/$SERVICE_NAME/image.tar" ]; then
        docker load < publish/$SERVICE_NAME/image.tar
        docker push $REGISTRY_IMAGE/$SERVICE_NAME:$CI_COMMIT_SHA
      fi

