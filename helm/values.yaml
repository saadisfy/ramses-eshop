        serviceName: "postgresql"  # Will become {release-name}-postgresql
        port: &postgres_port "5432"
        auth:
          username: &postgres_username "postgres"
          password: "CHANGEME" "yIoOi6U5qVkau2yZo1dFts"
      
      rabbitmq:
        secretRefName: "connectionstringeventbus"
        serviceName: "rabbitmq"  # Will become {release-name}-rabbitmq
        port: &rabbitmq_port "5672"  
        auth:
          username: &rabbitmq_username "guest"
          password: "CHANGEME" "6182sR0IUiNVZHU07E48Wu"
