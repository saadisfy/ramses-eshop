    ingress:
      enabled: false  # Background service
    postgresql:
      enabled: false  # No database needed
    sharedServices:
      rabbitmq:
        enabled: true
        serviceName: "rabbitmq-rabbitmq"
        port: 5672
        username: "user"
        password: "CHANGEME"
        subscriptionClientName: "Payment"
    livenessProbe:
      enabled: false
    readinessProbe:
      enabled: false
    resources:
      limits:
        cpu: 250m
        memory: 256Mi
      requests:
        cpu: 125m
        memory: 128Mi

