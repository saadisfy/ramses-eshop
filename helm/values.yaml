# ================================
# BACKGROUND PROCESSORS
# ================================

# Order Processor - Background Order Processing
order-processor:
  enabled: true
  base:
    application:
      name: "order-processor"
      environment: "Development"
      port: 8080
    image:
      registry: "ghcr.io/saadisfy/eshop"
      repository: "order-processor"
      tag: "1.0.0"
      pullPolicy: IfNotPresent
      pullSecret: "ghcr-secret"
    service:
      type: ClusterIP
      port: 80
      targetPort: 8080
    ingress:
      enabled: false  # Background service
    postgresql:
      enabled: false  # Uses ordering-api's shared PostgreSQL
    sharedServices:
      rabbitmq:
        enabled: true
        serviceName: "rabbitmq-rabbitmq"
        port: 5672
        username: "user"
        password: "CHANGEME"
        subscriptionClientName: "OrderProcessor"
    livenessProbe:
      enabled: false  # No HTTP endpoints
    readinessProbe:
      enabled: false
    config:
      appSettings:
        Logging__LogLevel__Default: "Information"
        Logging__LogLevel__Microsoft.AspNetCore: "Warning"
        # Database connection to shared ordering-api PostgreSQL
        ConnectionStrings__orderservicedb: "Host=ordering-api-postgresql;Port=5432;Database=orderservicedb;Username=postgres;Password=orderingpassword123"
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi

# Payment Processor - Background Payment Processing
payment-processor:
  enabled: true
  base:
    application:
      name: "payment-processor"
      environment: "Development"
      port: 8080
    image:
