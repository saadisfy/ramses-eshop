# Core environment variables shared by all services
envDefaults: &commonEnvDefaults
  - name: ASPNETCORE_ENVIRONMENT
    value: "Development"
  - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
    value: "true"
  - name: IdentityUrl
    value: "https://identity-api.saadisfy.me"
  - name: Logging__LogLevel__Default
    value: "Information"
  - name: Logging__LogLevel__Microsoft.AspNetCore
    value: "Warning"
  - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES
    value: "true"
  - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES
    value: "true"
  - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY
    value: "in_memory"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://aspire-dashboard:18889"


# ================================
# SHARED INFRASTRUCTURE
# ================================

# RabbitMQ EventBus (deploy first)
postgresql:
  enabled: true
  postgresql:
    service:
      port: *postgres_port
    auth:
      username: *postgres_username
      password: "CHANGEME"

rabbitmq:
  enabled: true
  rabbitmq:
    service:
      ports:
        amqp: *rabbitmq_port
    auth:
      username: *rabbitmq_username
      password: "CHANGEME"
      erlangCookie: *rabbitmq_cookie

redis:
  enabled: true
  redis:
    service:
      port: *redis_port
    auth:
      password: "CHANGEME"

# ================================
# MICROSERVICES
# ================================

# Core microservices
identity-api:
  enabled: true
  base:
    envDefaults: *commonEnvDefaults

basket-api:
  enabled: true
  base:
    envDefaults: *commonEnvDefaults

catalog-api:
  enabled: true
  base:
    envDefaults: *commonEnvDefaults

ordering-api:
  enabled: true
  base:
    envDefaults: *commonEnvDefaults

# Background processors
order-processor:
  enabled: true
  base:
    envDefaults: *commonEnvDefaults

payment-processor:
  enabled: true
  base:
    envDefaults: *commonEnvDefaults

# Webhook services
webhooks-api:
  enabled: true
  base:
    envDefaults: *commonEnvDefaults

webhook-client:
  enabled: true
  base:
    envDefaults: *commonEnvDefaults

# Frontend
webapp:
  enabled: true
  base:
    envDefaults: *commonEnvDefaults
