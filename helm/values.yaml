# eShop Umbrella Chart Values
# This file configures all eShop microservices for deployment

# Global configuration
global:
  imageRegistry: "ghcr.io/saadisfy/eshop"
  imageTag: "1.0.0"
  namespace: "eshop"
  
  # Common settings for all services
  common:
    pullSecret: "ghcr-secret"
    environment: "Development"  # or "Development"
    ingressClassName: "nginx"
    certIssuer: "letsencrypt-prod"
    domain: "saadisfy.me"

# ================================
# SHARED INFRASTRUCTURE
# ================================

# RabbitMQ EventBus (deploy first)
rabbitmq:
  enabled: true
  rabbitmq:
    auth:
      username: "user"
      password: "CHANGEME"
      erlangCookie: "CHANGEME"
    service:
      ports:
        amqp: 5672
    persistence:
      enabled: true
      size: 8Gi
    resources:
      limits:
        cpu: 375m
        memory: 384Mi
      requests:
        cpu: 250m
        memory: 256Mi

# ================================
# CORE MICROSERVICES
# ================================

# Identity API - Authentication & Authorization
identity-api:
  enabled: true
  base:
    application:
      name: "identity-api"
      environment: "Development"
      port: 8080
    image:
      registry: "ghcr.io/saadisfy/eshop"
      repository: "identity-api"
      tag: "1.0.0"
      pullPolicy: IfNotPresent
      pullSecret: "ghcr-secret"
    service:
      type: ClusterIP
      port: 80
      targetPort: 8080
    ingress:
      enabled: true
      className: "nginx"
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
      hosts:
        - host: "identity-api.saadisfy.me"
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: "identity-api-tls"
          hosts:
            - "identity-api.saadisfy.me"
    postgresql:
      enabled: true
      auth:
        database: "identitydb"
        username: "postgres"
        password: "CHANGEME"
    sharedServices:
      rabbitmq:
        enabled: true
        serviceName: "rabbitmq-rabbitmq"  # Points to umbrella RabbitMQ
        port: 5672
        username: "user"
        password: "CHANGEME"
        subscriptionClientName: "Identity"
    config:
      appSettings:
        Identity__Issuer: "https://identity-api.saadisfy.me"
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi

# Catalog API v2 - Product Catalog with AI Features
catalog-api-v2:
  enabled: true
  base:
    application:
      name: "catalog-api"
      environment: "Development"
      port: 8080
    image:
      registry: "ghcr.io/saadisfy/eshop"
      repository: "catalog-api"
      tag: "1.0.0"
      pullPolicy: IfNotPresent
      pullSecret: "ghcr-secret"
    service:
      type: ClusterIP
      port: 80
      targetPort: 8080
    ingress:
      enabled: true
      className: "nginx"
      annotations:
        cert-manager.io/cluster-issuer: "letsencrypt-prod"
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
      hosts:
        - host: "catalog-api.saadisfy.me"
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: "catalog-api-tls"
          hosts:
            - "catalog-api.saadisfy.me"
    postgresql:
      enabled: true
      image: "pgvector/pgvector:0.8.0-pg17-bookworm"  # AI/Vector support
      auth:
        database: "catalogdb"
        username: "postgres"
        password: "CHANGEME"
      initScripts:
        init.sql: |
          CREATE EXTENSION IF NOT EXISTS vector;
    sharedServices:
      rabbitmq:
        enabled: true
        serviceName: "rabbitmq-rabbitmq"
        port: 5672
        username: "user"
        password: "CHANGEME"
        subscriptionClientName: "Catalog"
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi

