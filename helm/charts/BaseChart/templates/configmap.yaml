{{- if .Values.config.createConfigMap -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "eshop-microservice.configMapName" . }}
  labels:
    {{- include "eshop-microservice.labels" . | nindent 4 }}
data:
  # Application configuration settings
  {{- range $key, $value := .Values.config.appSettings }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  
  # Microservice-specific configuration
  MicroserviceName: {{ .Values.microservice.name | quote }}
  Environment: {{ .Values.microservice.environment | quote }}
  
  # Additional configuration can be added here
  # This ConfigMap will be mounted as environment variables in the deployment
{{- end }}