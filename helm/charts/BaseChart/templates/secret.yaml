{{- if .Values.config.createSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eshop-microservice.secretName" . }}
  labels:
    {{- include "eshop-microservice.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.connectionStrings.enabled }}
  # Database connection strings - these should be provided via external secrets or values override
  {{- range $db, $name := .Values.infrastructure.postgres.databases }}
  ConnectionStrings__{{ $db | title }}DB: "Host={{ $.Values.infrastructure.postgres.serviceName }};Port={{ $.Values.infrastructure.postgres.port }};Database={{ $name }};Username=sa;Password=REPLACE_WITH_ACTUAL_PASSWORD"
  {{- end }}
  {{- end }}
  
  {{- if .Values.secrets.eventBus.enabled }}
  # Event Bus credentials
  EventBus__Password: "REPLACE_WITH_ACTUAL_PASSWORD"
  {{- end }}
  
  # Additional secrets can be added here
  # NOTE: In production, these should be managed externally (e.g., External Secrets Operator, Azure Key Vault, etc.)
  # This template serves as a base structure
{{- end }}