apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eshop-microservice.fullname" . }}
  labels:
    {{- include "eshop-microservice.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "eshop-microservice.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "eshop-microservice.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "eshop-microservice.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Values.microservice.name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "eshop-microservice.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ include "eshop-microservice.port" . }}
              protocol: TCP
          
          # Environment variables for microservice configuration
          env:
            # Basic microservice configuration
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.microservice.environment | quote }}
            - name: ASPNETCORE_URLS
              value: "http://+:{{ include "eshop-microservice.port" . }}"
            
            # Service Discovery - Environment variables for service endpoints
            {{- range $service, $endpoint := .Values.serviceEndpoints }}
            - name: ServiceEndpoints__{{ $service | title }}
              value: {{ $endpoint | quote }}
            {{- end }}
            
            # Infrastructure connection strings
            - name: ConnectionStrings__Redis
              value: "{{ .Values.infrastructure.redis.serviceName }}:{{ .Values.infrastructure.redis.port }}"
            - name: ConnectionStrings__EventBus
              value: "amqp://{{ .Values.infrastructure.eventBus.username }}@{{ .Values.infrastructure.eventBus.serviceName }}:{{ .Values.infrastructure.eventBus.port }}"
            
            # Event Bus configuration
            - name: EventBus__SubscriptionClientName
              value: {{ include "eshop-microservice.eventBusClientName" . | quote }}
            
            {{- if .Values.secrets.connectionStrings.enabled }}
            # Database connection strings from secrets
            {{- range $db, $name := .Values.infrastructure.postgres.databases }}
            - name: ConnectionStrings__{{ $db | title }}DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "eshop-microservice.secretName" $ }}
                  key: ConnectionStrings__{{ $db | title }}DB
            {{- end }}
            {{- end }}
            
            {{- if .Values.secrets.eventBus.enabled }}
            # Event Bus password from secret
            - name: EventBus__Password
              valueFrom:
                secretKeyRef:
                  name: {{ include "eshop-microservice.secretName" . }}
                  key: EventBus__Password
            {{- end }}
          
          {{- if .Values.config.createConfigMap }}
          # Additional configuration from ConfigMap
          envFrom:
            - configMapRef:
                name: {{ include "eshop-microservice.configMapName" . }}
          {{- end }}
          
          # Health checks for .NET applications
          livenessProbe:
            httpGet:
              path: {{ .Values.microservice.healthPath }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.microservice.readyPath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }} 