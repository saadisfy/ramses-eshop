# Webhooks API Configuration
# This chart deploys the eShop Webhooks API microservice using the basechart

base:
  # Application configuration
  application:
    name: &appName "webhooks-api"
  
  # Image configuration  
  image:
    registry: "ghcr.io/saadisfy/eshop"
    repository: "webhooks-api"
    tag: "1.0.0"
    pullPolicy: IfNotPresent
    pullSecret: "ghcr-secret"

  # Service configuration
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  # Ingress configuration
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: &appHost "webhooks-api.saadisfy.me"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: &appTlsSecret "webhooks-api-tls"
        hosts:
          - *appHost

  # PostgreSQL database configuration
  postgresql:
    enabled: true
    serviceName: ""  # If empty, defaults to: {{ .Release.Name }}-postgresql
    port: 5432
    connectionString: ""  # If empty, auto-generated from auth settings
    auth:
      database: "webhooksdb"
      username: "postgres"
      password: "CHANGEME"

  # Redis configuration (disabled for webhooks-api)
  redis:
    enabled: false

  # Shared services configuration (EventBus disabled per architecture)
  sharedServices:
    redis:
      enabled: false
    rabbitmq:
      enabled: false  # Webhooks API doesn't use EventBus

  # Application-specific configuration
  config:
    appSettings:
      Logging__LogLevel__Default: "Information"
      Logging__LogLevel__Microsoft.AspNetCore: "Warning"
      # Note: No EventBus configuration for webhooks-api

  # Resources
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  # ServiceAccount
  serviceAccount:
    create: true
    annotations: {}
    name: ""
    automount: true

  # Health checks
  livenessProbe:
    enabled: true
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10

  readinessProbe:
    enabled: true
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 5