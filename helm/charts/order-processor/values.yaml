# Order Processor Configuration
# This chart deploys the eShop Order Processor microservice using the basechart

base:
  # Application configuration
  application:
    name: &appName "order-processor"
  
  # Image configuration  
  image:
    registry: "ghcr.io/saadisfy/eshop"
    repository: "order-processor"
    tag: "1.0.0"
    pullPolicy: IfNotPresent
    pullSecret: "ghcr-secret"

  # Service configuration
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  # Ingress configuration (disabled for background processor)
  ingress:
    enabled: false #@cursor: add ingress, even if background processor 

  # PostgreSQL database configuration (references ordering-api's database)
  postgresql:
    enabled: false  # Uses ordering-api's PostgreSQL instance

  # Redis configuration (disabled for order-processor)
  redis:
    enabled: false

  # Shared services configuration (external EventBus)
  sharedServices:
    redis:
      enabled: false
    rabbitmq:
      enabled: true
      serviceName: ""  # If empty, defaults to external rabbitmq service
      port: 5672
      username: "user"
      password: "CHANGEME"
      subscriptionClientName: "OrderProcessor"

  # Application-specific configuration
  config:
    appSettings:
      Logging__LogLevel__Default: "Information"
      Logging__LogLevel__Microsoft.AspNetCore: "Warning"
      # Database connection to shared ordering-api PostgreSQL
      ConnectionStrings__orderservicedb: "Host=ordering-api-postgresql;Port=5432;Database=orderservicedb;Username=postgres;Password=orderingpassword123"
      # Note: EventBus settings are handled separately in the EventBus configuration section

  # Resources
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  # ServiceAccount
  serviceAccount:
    create: true
    annotations: {}
    name: ""
    automount: true

  # Health checks (disabled for background processor)
  livenessProbe:
    enabled: false #@cursor: add liveness probe

  readinessProbe:
    enabled: false #@cursor: add readiness probe