# Webhook Client Configuration
# This chart deploys the eShop Webhook Client microservice using the basechart

base:
  # Application configuration
  application:
    name: &appName "webhook-client"
  
  # Image configuration  
  image:
    registry: "ghcr.io/saadisfy/eshop"
    repository: "webhook-client"
    tag: "1.0.0"
    pullPolicy: IfNotPresent
    pullSecret: "ghcr-secret"

  # Service configuration
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  # Ingress configuration
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: &appHost "webhook-client.saadisfy.me"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: &appTlsSecret "webhook-client-tls"
        hosts:
          - *appHost

  # PostgreSQL database configuration (disabled for webhook-client)
  postgresql:
    enabled: false

  # Redis configuration (disabled for webhook-client)
  redis:
    enabled: false

  # Shared services configuration (all disabled for webhook-client)
  sharedServices:
    redis:
      enabled: false
    rabbitmq:
      enabled: false  # Webhook client doesn't use EventBus

  # Application-specific configuration
  config:
    appSettings:
      Logging__LogLevel__Default: "Information"
      Logging__LogLevel__Microsoft.AspNetCore: "Warning"
      # Note: Communicates directly with webhooks-api via HTTP

  # Resources
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 125m
      memory: 128Mi

  # ServiceAccount
  serviceAccount:
    create: true
    annotations: {}
    name: ""
    automount: true

  # Health checks
  livenessProbe:
    enabled: true
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10

  readinessProbe:
    enabled: true
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 5