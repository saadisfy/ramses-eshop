# Ordering API Configuration
# This chart deploys the eShop Ordering API microservice using the basechart

base:
  # Application configuration
  application:
    name: &appName "ordering-api"
  
  # Image configuration  
  image:
    registry: "ghcr.io/saadisfy/eshop"
    repository: "ordering-api"
    tag: "1.0.0"
    pullPolicy: IfNotPresent
    pullSecret: "ghcr-secret"

  # Service configuration
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  # Ingress configuration
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: &appHost "ordering-api.saadisfy.me"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: &appTlsSecret "ordering-api-tls"
        hosts:
          - *appHost

  # PostgreSQL database configuration (shared with order-processor)
  postgresql:
    enabled: true
    serviceName: ""  # If empty, defaults to: {{ .Release.Name }}-postgresql
    port: 5432
    connectionString: ""  # If empty, auto-generated from auth settings
    auth:
      database: "orderservicedb"  # Shared database for ordering services
      username: "postgres"
      password: "CHANGEME"

  # Redis configuration (disabled for ordering-api)
  redis:
    enabled: false

  # Shared services configuration (external EventBus)
  sharedServices:
    redis:
      enabled: false
    rabbitmq:
      enabled: true
      serviceName: ""  # If empty, defaults to external rabbitmq service
      port: 5672
      username: "user"
      password: "CHANGEME"
      subscriptionClientName: "Ordering"

  # Application-specific configuration
  config:
    appSettings:
      Logging__LogLevel__Default: "Information"
      Logging__LogLevel__Microsoft.AspNetCore: "Warning"
      # Note: EventBus settings are handled separately in the EventBus configuration section

  # Resources
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  # ServiceAccount
  serviceAccount:
    create: true
    annotations: {}
    name: ""
    automount: true

  # Health checks
  livenessProbe:
    enabled: true
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10

  readinessProbe:
    enabled: true
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 5