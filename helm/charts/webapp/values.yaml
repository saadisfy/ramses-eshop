# WebApp Configuration
# This chart deploys the eShop Web Application using the basechart

base:
  # Application configuration
  application:
    name: &appName "webapp"
  
  # Image configuration  
  image:
    registry: "ghcr.io/saadisfy/eshop"
    repository: "webapp"
    tag: "1.0.0"
    pullPolicy: IfNotPresent
    pullSecret: "ghcr-secret"

  # Service configuration
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  # Ingress configuration
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: &appHost "webapp.saadisfy.me"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: &appTlsSecret "webapp-tls"
        hosts:
          - *appHost

  # PostgreSQL database configuration (disabled for webapp)
  postgresql:
    enabled: false

  # Redis configuration (disabled for webapp)
  redis:
    enabled: false

  # Shared services configuration (EventBus for API communication)
  sharedServices:
    redis:
      enabled: false
    rabbitmq:
      enabled: true
      serviceName: ""  # If empty, defaults to external rabbitmq service
      port: 5672
      username: "user"
      password: "CHANGEME"
      subscriptionClientName: "WebApp"

  # Application-specific configuration
  config:
    appSettings:
      Logging__LogLevel__Default: "Information"
      Logging__LogLevel__Microsoft.AspNetCore: "Warning"
      # API endpoints
      IdentityApiClient: "https://identity-api.saadisfy.me"
      CatalogApiClient: "https://catalog-api.saadisfy.me"
      OrderingApiClient: "https://ordering-api.saadisfy.me"
      BasketApiClient: "https://basket-api.saadisfy.me"
      # Note: EventBus settings are handled separately in the EventBus configuration section

  # Resources
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  # ServiceAccount
  serviceAccount:
    create: true
    annotations: {}
    name: ""
    automount: true

  # Health checks
  livenessProbe:
    enabled: true
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10

  readinessProbe:
    enabled: true
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 5