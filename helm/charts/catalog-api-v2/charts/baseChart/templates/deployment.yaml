apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "application.fullname" . }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "application.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "application.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      serviceAccountName: {{ include "application.serviceAccountName" . }}
      {{- end }}
      containers:
        - name: {{ .Values.application.name }}
          image: {{ include "application.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ include "application.port" . }}
              protocol: TCP
          
          env:
            # Basic configuration
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.application.environment | quote }}
            - name: ASPNETCORE_URLS
              value: "http://+:{{ .Values.application.port }}"
            
            {{- if .Values.postgresql.enabled }}
            # Database connection - PostgreSQL (when enabled)
            - name: ConnectionStrings__{{ .Values.postgresql.auth.database }}
              value: {{ include "application.postgresqlConnectionString" . | quote }}
            {{- end }}
            
            {{- if .Values.sharedServices.redis.enabled }}
            # Redis connection (when enabled)
            - name: ConnectionStrings__Redis
              value: "{{ .Values.sharedServices.redis.serviceName }}:{{ .Values.sharedServices.redis.port }}"
            {{- end }}
            
            {{- if .Values.sharedServices.rabbitmq.enabled }}
            # Event Bus connection (when enabled)
            - name: ConnectionStrings__EventBus
              value: "amqp://{{ .Values.sharedServices.rabbitmq.username }}:{{ .Values.sharedServices.rabbitmq.password }}@{{ .Values.sharedServices.rabbitmq.serviceName | default (printf "%s-rabbitmq" .Release.Name) }}:{{ .Values.sharedServices.rabbitmq.port }}"
            
            # Event Bus configuration
            - name: EventBus__SubscriptionClientName
              value: {{ include "application.eventBusClientName" . | quote }}
            - name: EventBus__RetryCount
              value: "10"
            {{- end }}
            
            # Application settings
            {{- range $key, $value := .Values.config.appSettings }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          
          {{- if eq .Values.application.environment "Development" }}
          # Health checks - only enabled in Development environment
          livenessProbe:
            httpGet:
              path: {{ .Values.application.healthPath }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.application.healthPath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          {{- end }}
          
          resources:
            {{- toYaml .Values.resources | nindent 12 }}