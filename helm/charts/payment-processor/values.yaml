# Payment Processor Configuration
# This chart deploys the eShop Payment Processor microservice using the basechart

base:
  # Application configuration
  application:
    name: &appName "payment-processor"
  
  # Image configuration  
  image:
    registry: "ghcr.io/saadisfy/eshop"
    repository: "payment-processor"
    tag: "1.0.0"
    pullPolicy: IfNotPresent
    pullSecret: "ghcr-secret"

  # Service configuration
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080

  # Ingress configuration (disabled for background processor)
  ingress:
    enabled: false #@cursor: add ingress, even if background processor 

  # PostgreSQL database configuration (disabled for payment-processor)
  postgresql:
    enabled: false

  # Redis configuration (disabled for payment-processor)
  redis:
    enabled: false

  # Shared services configuration (external EventBus only)
  sharedServices:
    redis:
      enabled: false
    rabbitmq:
      enabled: true
      serviceName: ""  # If empty, defaults to external rabbitmq service
      port: 5672
      username: "user"
      password: "CHANGEME"
      subscriptionClientName: "Payment"

  # Application-specific configuration
  config:
    appSettings:
      Logging__LogLevel__Default: "Information"
      Logging__LogLevel__Microsoft.AspNetCore: "Warning"
      # Note: EventBus settings are handled separately in the EventBus configuration section

  # Resources
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 125m
      memory: 128Mi

  # ServiceAccount
  serviceAccount:
    create: true
    annotations: {}
    name: ""
    automount: true

  # Health checks (disabled for background processor)
  livenessProbe:
    enabled: false #@cursor: add liveness probe

  readinessProbe:
    enabled: false #@cursor: add readiness probe