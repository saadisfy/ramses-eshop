# Catalog API with dedicated PostgreSQL instance


# Certificate issuer configuration (YAML anchor for reuse) prod or staging 
certIssuerName: &certIssuerName "letsencrypt-prod"
certIssuerKind: &certIssuerKind "ClusterIssuer"



# Microservice configuration
microservice:
  name: "catalog-api"
  environment: "Development" # alternatively: "Production"
  port: 8080
  healthPath: "/health"  # only available in .microservice.environment == "Development"
  # readyPath: "/health"

# Container image
image:
  registry: "ghcr.io/saadisfy/eshop"
  repository: "catalog-api"
  tag: "1.0.0"
  pullPolicy: IfNotPresent
  pullSecret: "ghcr-secret"

# Service configuration
service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: *certIssuerName
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: catalog-api.saadisfy.me
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - catalog-api.saadisfy.me
      secretName: catalog-api-tls




# PostgreSQL configuration (custom deployment)
postgresql:
  enabled: true
  auth:
    username: "postgres"
    password: "CHANGEME"
    database: "catalogdb"

# Shared services (Redis, RabbitMQ) - can deploy locally or reference external services
# TODO: @saadisfy - Create separate shared infrastructure chart for RabbitMQ and Redis
#       instead of deploying with each microservice. Move these to helm/shared-services/
# coudldis is only needed for the baske-service, then a separate chart is not needed for redis 
sharedServices:
  redis:
    serviceName: "redis-service"
    port: 6379
  rabbitmq:
    serviceName: "catalog-api-rabbitmq"  # Bitnami chart service name
    port: 5672
    username: "user"
    password: "CHANGEME"

# RabbitMQ configuration (Bitnami chart)
rabbitmq:
  enabled: true
  auth:
    username: "user"
    password: "CHANGEME"
    erlangCookie: "CHANGEME"
  service:
    ports:
      amqp: 5672

# Application configuration
config:
  appSettings:
    Logging__LogLevel__Default: "Information"
    Logging__LogLevel__Microsoft.AspNetCore: "Warning"
    EventBus__SubscriptionClientName: "Catalog"
    EventBus__RetryCount: "10"
    CatalogOptions__UseCustomizationData: "false"

# Resources
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

# Autoscaling
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10