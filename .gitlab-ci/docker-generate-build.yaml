# Docker generate build stage jobs
# This file contains all Docker build jobs that use .NET's built-in container generation
# instead of Dockerfiles




docker-generate-basket-api:
  extends: .generate-dotnet-container
  variables:
    SERVICE_NAME: "basket-api"
    PROJECT_PATH: "src/Basket.API/Basket.API.csproj"

