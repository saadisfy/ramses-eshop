# Webhooks API Configuration
# This chart configures the baseChart for the Webhooks API microservice

# need global values from Umbrella chart for shared services

base:
  # Application configuration
  application:
    name: &appName "webhooks-api"
    environment: "Development"
    healthPath: "/health"
    minReadySeconds: 60
    ports:
      httpContainerPort: 8080
      httpsContainerPort: 8443
    terminationGracePeriodSeconds: 180

  # Environment variable overrides for this specific service
  envOverrides:
    - name: OTEL_SERVICE_NAME
      value: *appName
  
  # Image configuration  
  image:
    registry: "ghcr.io/saadisfy/eshop"
    repository: "webhooks-api"
    tag: "1.0.0"
    pullPolicy: IfNotPresent
    pullSecret: "ghcr-secret"



  # Ingress configuration
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: &appHost "webhooks-api.saadisfy.me"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: &appTlsSecret "webhooks-api-tls"
        hosts:
          - *appHost

  # Shared services configuration
  sharedServices:
    redis:
      enabled: false  # Webhooks API doesn't need Redis
    rabbitmq:
      enabled: true  # Webhooks API uses RabbitMQ for events
      subscriptionClientName: "Webhooks"  # Override subscription client name
    postgresql:
      enabled: true  # Webhooks API needs PostgreSQL
      createSecret: true  # This service creates its own PostgreSQL secret
      secretRefName: "connectionstringpostgresql-webhooks"  # Override secret name with microservice name
      auth:
        database: "webhooksdb"  # Override database name for this microservice

