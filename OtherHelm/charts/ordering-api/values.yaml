# Ordering API Configuration
# This chart configures the baseChart for the Ordering API microservice

# need global values from Umbrella chart for shared services

base:
  # Application configuration
  application:
    name: &appName "ordering-api"
    environment: "Development"
    healthPath: "/health"
    minReadySeconds: 60
    ports:
      httpContainerPort: 8080
      httpsContainerPort: 8443
    terminationGracePeriodSeconds: 180

  # Environment variable overrides for this specific service
  envOverrides:
    - name: OTEL_SERVICE_NAME
      value: *appName
    - name: Identity__Url
      value: "https://identity-api.saadisfy.me"
    - name: Identity__Audience
      value: "orders"
    - name: Identity__Scopes__orders
      value: "Ordering API"
    - name: OpenApi__Document__Title
      value: "eShop - Ordering HTTP API"
    - name: OpenApi__Document__Description
      value: "The Ordering Service HTTP API"
    - name: OpenApi__Document__Version
      value: "v1"
    - name: OpenApi__Endpoint__Name
      value: "Ordering.API V1"
  
  # Image configuration  
  image:
    registry: "ghcr.io/saadisfy/eshop"
    repository: "ordering-api"
    tag: "1.0.0"
    pullPolicy: IfNotPresent
    pullSecret: "ghcr-secret"



  # Ingress configuration
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: &appHost "ordering-api.saadisfy.me"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: &appTlsSecret "ordering-api-tls"
        hosts:
          - *appHost

  # Shared services configuration
  sharedServices:
    redis:
      enabled: false  # Ordering API doesn't need Redis
    rabbitmq:
      enabled: true  # Ordering API uses RabbitMQ for events
      subscriptionClientName: "Ordering"  # Override subscription client name
    postgresql:
      enabled: true  # Ordering API needs PostgreSQL
      createSecret: true  # This service creates the PostgreSQL secret
      secretRefName: "connectionstringpostgresql-ordering"  # Override secret name with microservice name
      auth:
        database: "orderingdb"  # Override database name for this microservice

