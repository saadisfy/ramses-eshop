# Webhook Client Configuration
# This chart configures the baseChart for the Webhook Client microservice

# need global values from Umbrella chart for shared services

base:
  # Application configuration
  application:
    name: &appName "webhook-client"
    environment: "Development"
    healthPath: "/health"
    minReadySeconds: 60
    ports:
      httpContainerPort: 8080
      httpsContainerPort: 8443
    terminationGracePeriodSeconds: 180

  # Environment variable overrides for this specific service
  envOverrides:
    - name: OTEL_SERVICE_NAME
      value: *appName
    - name: CallBackUrl
      value: /signin-oidc
    - name: services__webhooks-api__http__0
      value: http://webhooks-api:8080
    - name: services__webhooks-api__https__0
      value: https://webhooks-api.saadisfy.me

  # Image configuration  
  image:
    registry: "ghcr.io/saadisfy/eshop"
    repository: "webhook-client"
    tag: "1.0.0"
    pullPolicy: IfNotPresent
    pullSecret: "ghcr-secret"



  # Ingress configuration
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: &appHost "webhook-client.saadisfy.me"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: &appTlsSecret "webhook-client-tls"
        hosts:
          - *appHost

  # Shared services configuration
  sharedServices:
    redis:
      enabled: false  # Webhook Client doesn't need Redis
    rabbitmq:
      enabled: false  # Webhook Client doesn't use RabbitMQ
    postgresql:
      enabled: false  # Webhook Client doesn't need PostgreSQL