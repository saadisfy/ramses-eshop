# Catalog API - Using baseChart dependency
# This chart configures the baseChart for the Catalog API microservice
    
# need global values from Umbrella chart for shared services


base:
  # Application configuration
  application:
    name: &appName "catalog-api"
    environment: "Development" # alternatively: "Production"
    healthPath: "/health"
    minReadySeconds: 60
    ports:
      httpContainerPort: 8080
      httpsContainerPort: 8443
    terminationGracePeriodSeconds: 180

  # Environment variable overrides for this specific service
  envOverrides: #todo: check if audience is needed
    - name: Identity__Audience
      value: "catalog"
    - name: Identity__Scopes__catalog
      value: "Catalog API"
    - name: OpenApi__Document__Title
      value: "eShop - Catalog HTTP API"
    - name: OpenApi__Document__Description
      value: "The Catalog Microservice HTTP API. This is a Data-Driven/CRUD microservice sample"
    - name: OpenApi__Document__Version
      value: "v1"
    - name: OpenApi__Endpoint__Name
      value: "Catalog.API V1"
    - name: OTEL_SERVICE_NAME
      value: *appName
  # Container image
  image:
    registry: "ghcr.io/saadisfy/eshop"
    repository: "catalog-api"
    tag: "1.0.0"
    pullPolicy: IfNotPresent
    pullSecret: "ghcr-secret"

  # Ingress configuration
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: &appHost "catalog-api.saadisfy.me"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: &appTlsSecret "catalog-api-tls"
        hosts:
          - *appHost

  sharedServices:
      redis:
        enabled: false  # Catalog API doesn't need Redis
      rabbitmq:
        enabled: true  # Catalog API uses RabbitMQ for events
        subscriptionClientName: "Catalog"  # Override subscription client name
      postgresql:
        enabled: true  # Catalog API needs PostgreSQL with vector support
        createSecret: true  # This service creates its own PostgreSQL secret
        secretRefName: "connectionstringpostgresql-catalog"  # Override secret name with microservice name
        auth:
          database: "catalogdb"  # Override database name for this microservice