apiVersion: v1
kind: Service
metadata:
  name: {{ include "application.fullname" . }}
  labels:
    {{- include "application.labels" . | nindent 4 }}
spec:
  ports:
    - port: {{ .Values.service.ports.httpPort }}
      targetPort: {{ .Values.application.ports.httpContainerPort }}
      protocol: TCP
      name: http
    - port: {{ .Values.service.ports.httpsPort }}
      targetPort: {{ .Values.application.ports.httpsContainerPort }}
      protocol: TCP
      name: https
  selector:
    {{- include "application.selectorLabels" . | nindent 4 }}
  type: {{ .Values.service.type }}